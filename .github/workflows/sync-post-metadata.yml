name: Sync Post Metadata from Merged PR

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  sync-metadata:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Assignees and Labels & Update posts-metadata.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            // 1. Get Assignee / Author
            let githubUsername = '';
            let authorName = '';

            if (pr.assignees && pr.assignees.length > 0) {
              githubUsername = pr.assignees[0].login;
            } else if (pr.user) {
              githubUsername = pr.user.login;
            }

            // Fetch display name from GitHub user profile
            try {
              const { data: userData } = await github.rest.users.getByUsername({
                username: githubUsername
              });
              authorName = userData.name || userData.login;
            } catch (e) {
              authorName = githubUsername;
            }

            // 2. Get PR Labels
            const labels = (pr.labels || []).map(l => l.name.toLowerCase().trim());

            // 3. Get changed files in this PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const mdxFiles = files
              .map(f => f.filename)
              .filter(f => f.startsWith('posts/') && f.endsWith('.mdx'));

            if (mdxFiles.length === 0) {
              console.log('No posts/*.mdx files were modified in this PR.');
              return;
            }

            // 4. Load post stats calculator (ignoring frontmatter and code blocks)
            let calculatePostStats;
            try {
              calculatePostStats = require(path.join(process.cwd(), 'scripts', 'calculate-post-stats.js')).calculatePostStats;
            } catch (e) {
              calculatePostStats = function(fileContent) {
                const withoutFrontmatter = fileContent.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');
                const withoutCodeBlocks = withoutFrontmatter
                  .replace(/```[\s\S]*?```/g, '')
                  .replace(/~~~[\s\S]*?~~~/g, '');
                const trimmed = withoutCodeBlocks.trim();
                const words = trimmed ? trimmed.split(/\s+/).filter(Boolean) : [];
                const wordCount = words.length;
                const readingTime = wordCount === 0 ? 0 : Math.max(1, Math.ceil(wordCount / 200));
                return { wordCount, readingTime };
              };
            }

            // 5. Load or create posts-metadata.json
            const metadataPath = path.join(process.cwd(), 'posts-metadata.json');
            let metadata = {};
            if (fs.existsSync(metadataPath)) {
              try {
                metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
              } catch (e) {
                metadata = {};
              }
            }

            for (const file of mdxFiles) {
              const slug = path.basename(file, '.mdx');
              const fullPath = path.join(process.cwd(), file);
              let wordCount = 0;
              let readingTime = 0;

              if (fs.existsSync(fullPath)) {
                try {
                  const content = fs.readFileSync(fullPath, 'utf8');
                  const stats = calculatePostStats(content);
                  wordCount = stats.wordCount;
                  readingTime = stats.readingTime;
                } catch (err) {
                  console.warn(`Could not compute stats for ${file}:`, err.message);
                }
              }

              metadata[slug] = {
                author: authorName,
                githubUsername: githubUsername,
                labels: labels,
                updatedAt: new Date().toISOString(),
                prNumber: prNumber,
                wordCount: wordCount,
                readingTime: readingTime
              };
              console.log(`Updated metadata for ${slug}: author=${authorName} (@${githubUsername}), labels=[${labels.join(', ')}], wordCount=${wordCount}, readingTime=${readingTime} min`);
            }

            fs.writeFileSync(metadataPath, JSON.stringify(metadata, null, 2), 'utf8');

      - name: Sync Contributors JSON
        run: node scripts/sync-contributors.js

      - name: Commit and Push Metadata & Contributors
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts-metadata.json contributors.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync post metadata & contributors from PR #${{ github.event.pull_request.number }} [skip ci]" && git push)
